# =============================================================================
# Drishti DocVision AI – Docker Compose
# Usage:
#   docker compose up --build
#   open http://localhost:8501
# =============================================================================

services:
  drishti:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: drishti-docvision:latest
    container_name: drishti-docvision
    ports:
      - "8501:8501"
    environment:
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - STREAMLIT_BROWSER_GATHER_USAGE_STATS=false
      # Set to "1" to force GPU (requires nvidia-container-toolkit + GPU image)
      - USE_GPU=0
    volumes:
      # Persist uploaded / sample documents if desired
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s

  # Optional: lightweight nginx reverse-proxy for production
  # Uncomment if you need TLS / custom domain
